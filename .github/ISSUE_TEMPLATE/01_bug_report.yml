name: "🐞 Bug report"
description: File a bug report
title: "[bug]: "
labels: ["type:bug", "status:triage"]
assignees: ["ss-o"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A report that someone else can reproduce from a clean shell gets fixed fastest, so please fill in every required field.
  - type: input
    id: version
    attributes:
      label: Affected version
      description: The release, branch or commit of this project where you see the bug.
      placeholder: "ex. v1.2.0, or main at 1a2b3c4"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Your Zsh version, operating system, and how this project is loaded: the plugin manager and its version or commit, or a plain `source`. Add the terminal or anything else the bug depends on.
      placeholder: |
        Zsh: output of `zsh --version`
        OS: ex. Debian 13, macOS 15.5
        Loaded with: ex. zi at 1a2b3c4, or `source path/to/plugin.zsh`
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        The shortest set of commands that shows the bug, starting from `zsh -f` (no startup files) or a clean `HOME`. Include only the configuration the bug needs.
      render: zsh
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens, with the exact output or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Logs, screenshots, or whether the bug started after an update. For Zi, the output of `zi analytics` helps.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Self-service
      description: |
        If you feel like you could contribute to this issue, please check the box below. This would tell us and other people looking for contributions that someone's working on it.
        If you do check this box, please send a pull request within 7 days so we can still delegate this to someone else.
      options:
        - label: I'd be willing to fix this bug myself.
  - type: checkboxes
    attributes:
      label: Have you read the Contributing Guidelines?
      options:
        - label: I have read the [Contributing Guidelines](https://github.com/z-shell/.github/blob/main/.github/CONTRIBUTING.md).
          required: true
  - type: checkboxes
    attributes:
      label: Are you familiar with the Contributor Covenant Code of Conduct?
      options:
        - label: I have read the [Contributor Covenant Code of Conduct](https://github.com/z-shell/.github/blob/main/.github/CODE_OF_CONDUCT.md).
          required: true
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
