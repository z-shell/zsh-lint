---
name: Wiki Docs Sync

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".gomarkdoc.yml"
      - "internal/wikidoc/**"
      - "cmd/wikidoc/**"
      - ".github/workflows/wiki-docs-sync.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wiki-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: wiki-sync
    steps:
      # This outbound-only integration intentionally has no webhook or OAuth
      # flow. The environment admits main only, while each installation token
      # is restricted to z-shell/wiki and the two permissions used below.
      - name: Mint wiki app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WIKI_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.WIKI_SYNC_APP_PRIVATE_KEY }}
          owner: z-shell
          repositories: wiki
          permission-contents: write
          permission-pull-requests: write

      - name: Check out zsh-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zsh-lint
          fetch-depth: 0

      - name: Check out wiki (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/wiki
          ref: main
          path: wiki
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: zsh-lint/go.sum

      - name: Generate and inject reference
        id: reference
        working-directory: zsh-lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_tag="$(gh release view --repo z-shell/zsh-lint --json tagName --jq .tagName)"
          stable_commit="$(git rev-parse "${stable_tag}^{commit}")"
          release_tree="$RUNNER_TEMP/zsh-lint-release"
          mkdir -p "$release_tree"
          git archive "$stable_tag" | tar -x -C "$release_tree"
          (
            cd "$release_tree"
            go tool gomarkdoc --output "$RUNNER_TEMP/ref.md" ./internal/rules
          )
          go run ./cmd/wikidoc \
            -mode rules \
            -in "$RUNNER_TEMP/ref.md" \
            -mdx ../wiki/community/04_zsh_lint/08_rule_reference.mdx \
            -source-version "$stable_tag" \
            -source-commit "$stable_commit"
          echo "version=$stable_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$stable_commit" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        id: sync-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: wiki
          # docs-sync/zsh-lint is a fixed automation-branch exception to the
          # wiki's human feature-ID naming convention. A fixed branch lets a
          # later run update the existing PR rather than open a duplicate.
          add-paths: community/04_zsh_lint/08_rule_reference.mdx
          sign-commits: true
          base: main
          branch: docs-sync/zsh-lint
          title: "docs(zsh-lint): sync generated reference"
          commit-message: "docs(zsh-lint): sync generated reference from zsh-lint"
          body: |
            Automated reference sync from `z-shell/zsh-lint`.
            Generated from published rule documentation. Do not hand-edit the marked region.
            Published source: ${{ steps.reference.outputs.version }}
            Source commit: ${{ steps.reference.outputs.commit }}
          delete-branch: true

      - name: Report sync PR operation
        env:
          PR_OPERATION: ${{ steps.sync-pr.outputs.pull-request-operation }}
        run: echo "::notice::sync-pr-operation=${PR_OPERATION:-none}"

      - name: Verify signed sync commits
        if: >-
          steps.sync-pr.outputs.pull-request-operation == 'created' ||
          steps.sync-pr.outputs.pull-request-operation == 'updated'
        env:
          COMMITS_VERIFIED: ${{ steps.sync-pr.outputs.pull-request-commits-verified }}
        run: |
          if [ "$COMMITS_VERIFIED" != "true" ]; then
            echo "::error::The created or updated sync PR contains an unverified commit."
            exit 1
          fi
