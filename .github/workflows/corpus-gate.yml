---
name: Corpus Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/regression-corpus.sh"
      - ".github/workflows/corpus-gate.yml"
      - "cmd/**"
      - "docs/project/corpus.md"
      - "docs/project/corpus-paths.txt"
      - "docs/project/corpus-revisions.txt"
      - "docs/project/regression-corpus.txt"
      - "docs/project/corpus-configs/**"
      - "docs/project/configured-corpus-expected.json"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "third_party/**"
  pull_request:
    paths:
      - ".github/scripts/regression-corpus.sh"
      - ".github/workflows/corpus-gate.yml"
      - "cmd/**"
      - "docs/project/corpus.md"
      - "docs/project/corpus-paths.txt"
      - "docs/project/corpus-revisions.txt"
      - "docs/project/regression-corpus.txt"
      - "docs/project/corpus-configs/**"
      - "docs/project/configured-corpus-expected.json"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "third_party/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Reference corpus
    runs-on: ubuntu-latest
    steps:
      - name: Check out zsh-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zsh-lint
          persist-credentials: false

      - name: Resolve pinned corpus revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          # Pull-request and push runs check every consumer out at the revision
          # recorded in docs/project/corpus-revisions.txt, so a consumer change
          # cannot fail an unrelated zsh-lint pull request (#291). The weekly
          # schedule and a manual dispatch keep tracking main; a failure there
          # is the drift signal that a reviewed revision bump is due.
          while read -r repository revision; do
            [[ -n $repository && -n $revision ]] || continue
            if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::corpus-revisions.txt: $repository is not pinned to a full commit SHA: $revision"
              exit 1
            fi
            echo "$repository=$revision" >> "$GITHUB_OUTPUT"
          done < zsh-lint/docs/project/corpus-revisions.txt
          for repository in src zd zunit z-a-meta-plugins zsh-fancy-completions zsh-eza; do
            grep -q "^$repository=" "$GITHUB_OUTPUT" || {
              echo "::error::corpus-revisions.txt has no revision for $repository"
              exit 1
            }
          done

      - name: Check out src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/src
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.src }}
          path: corpus/src
          persist-credentials: false

      - name: Check out zd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zd
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zd }}
          path: corpus/zd
          persist-credentials: false

      - name: Check out zunit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zunit
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zunit }}
          path: corpus/zunit
          persist-credentials: false

      - name: Check out z-a-meta-plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/z-a-meta-plugins
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.z-a-meta-plugins }}
          path: corpus/z-a-meta-plugins
          persist-credentials: false

      - name: Check out zsh-fancy-completions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zsh-fancy-completions
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zsh-fancy-completions }}
          path: corpus/zsh-fancy-completions
          persist-credentials: false

      - name: Check out zsh-eza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zsh-eza
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zsh-eza }}
          path: corpus/zsh-eza
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: zsh-lint/go.sum

      - name: Set up Zsh
        uses: z-shell/.github/actions/setup-zsh@4403e5a200c63596f641966dfb64e08a7a655ffa # main

      - name: Build corpus tools
        working-directory: zsh-lint
        run: |
          go build -o "$RUNNER_TEMP/zsh-lint-survey" ./cmd/zsh-lint-survey
          go build -o "$RUNNER_TEMP/zsh-lint" ./cmd/zsh-lint

      - name: Record corpus revisions
        working-directory: corpus
        run: |
          for repository in src zd zunit z-a-meta-plugins zsh-fancy-completions zsh-eza; do
            printf '%s ' "$repository"
            git -C "$repository" rev-parse HEAD
          done

      - name: Verify reference corpus
        working-directory: corpus
        shell: bash
        env:
          EXPECTED_CORPUS_FILES: "18"
        run: |
          set -euo pipefail
          mapfile -t roots < ../zsh-lint/docs/project/corpus-paths.txt
          for root in "${roots[@]}"; do
            if [[ ! -e "$root" ]]; then
              echo "::error::Corpus path does not exist: $root"
              exit 1
            fi
          done

          mapfile -d '' files < <(find "${roots[@]}" -type f -print0 | sort -z)
          if [[ ${#files[@]} -ne $EXPECTED_CORPUS_FILES ]]; then
            echo "::error::Expected $EXPECTED_CORPUS_FILES corpus files, found ${#files[@]}. On a schedule or dispatch run this means a consumer main branch changed: bump docs/project/corpus-revisions.txt and the expected count in one reviewed change (docs/project/corpus.md, Changing the corpus)."
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          for file in "${files[@]}"; do
            zsh -f -n -- "$file"
          done
          "$RUNNER_TEMP/zsh-lint-survey" "${files[@]}"

          analyzer_status=0
          "$RUNNER_TEMP/zsh-lint" --format=json --no-config "${files[@]}" > "$RUNNER_TEMP/corpus-diagnostics.json" || analyzer_status=$?
          jq . "$RUNNER_TEMP/corpus-diagnostics.json"
          if ! jq -e '.summary.errors == 0 and .summary.warnings == 0' "$RUNNER_TEMP/corpus-diagnostics.json" >/dev/null; then
            echo "::error::The corpus contains error- or warning-level diagnostics."
            exit 1
          fi
          if [[ $analyzer_status -ne 0 ]]; then
            echo "::error::zsh-lint exited with status $analyzer_status."
            exit "$analyzer_status"
          fi

  configured-corpus:
    name: Configured corpus
    runs-on: ubuntu-latest
    steps:
      - name: Check out zsh-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zsh-lint
          persist-credentials: false

      - name: Resolve pinned corpus revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          # Pull-request and push runs check every consumer out at the revision
          # recorded in docs/project/corpus-revisions.txt, so a consumer change
          # cannot fail an unrelated zsh-lint pull request (#291). The weekly
          # schedule and a manual dispatch keep tracking main; a failure there
          # is the drift signal that a reviewed revision bump is due.
          while read -r repository revision; do
            [[ -n $repository && -n $revision ]] || continue
            if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::corpus-revisions.txt: $repository is not pinned to a full commit SHA: $revision"
              exit 1
            fi
            echo "$repository=$revision" >> "$GITHUB_OUTPUT"
          done < zsh-lint/docs/project/corpus-revisions.txt
          for repository in src zd zunit z-a-meta-plugins zsh-fancy-completions zsh-eza; do
            grep -q "^$repository=" "$GITHUB_OUTPUT" || {
              echo "::error::corpus-revisions.txt has no revision for $repository"
              exit 1
            }
          done

      - name: Check out src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/src
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.src }}
          path: corpus/src
          persist-credentials: false

      - name: Check out zd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zd
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zd }}
          path: corpus/zd
          persist-credentials: false

      - name: Check out zunit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zunit
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zunit }}
          path: corpus/zunit
          persist-credentials: false

      - name: Check out z-a-meta-plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/z-a-meta-plugins
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.z-a-meta-plugins }}
          path: corpus/z-a-meta-plugins
          persist-credentials: false

      - name: Check out zsh-fancy-completions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zsh-fancy-completions
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zsh-fancy-completions }}
          path: corpus/zsh-fancy-completions
          persist-credentials: false

      - name: Check out zsh-eza
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/zsh-eza
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'main' || steps.revisions.outputs.zsh-eza }}
          path: corpus/zsh-eza
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: zsh-lint/go.sum

      - name: Build configured analyzer
        working-directory: zsh-lint
        run: go build -o "$RUNNER_TEMP/zsh-lint" ./cmd/zsh-lint

      - name: Record configured corpus revisions
        working-directory: corpus
        run: |
          for repository in src zd zunit z-a-meta-plugins zsh-fancy-completions zsh-eza; do
            printf '%s ' "$repository"
            git -C "$repository" rev-parse HEAD
          done

      - name: Verify configured corpus classifications
        working-directory: corpus
        shell: bash
        run: |
          set -euo pipefail
          repositories=(src zd zunit z-a-meta-plugins zsh-fancy-completions zsh-eza)
          diagnostic_files=()

          for repository in "${repositories[@]}"; do
            config_source="../zsh-lint/docs/project/corpus-configs/$repository.json"
            config="$repository/.zsh-lint-corpus.json"
            cp "$config_source" "$config"

            mapfile -t roots < <(sed -n "s#^$repository/##p" ../zsh-lint/docs/project/corpus-paths.txt)
            if [[ ${#roots[@]} -eq 0 ]]; then
              echo "::error::No configured corpus roots found for $repository."
              exit 1
            fi

            input_roots=()
            for root in "${roots[@]}"; do
              input_roots+=("$repository/$root")
            done
            mapfile -d '' files < <(find "${input_roots[@]}" -type f -print0 | sort -z)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "::error::No configured corpus files found for $repository."
              exit 1
            fi

            diagnostics="$RUNNER_TEMP/configured-$repository.json"
            analyzer_status=0
            "$RUNNER_TEMP/zsh-lint" --format=json --config "$config" "${files[@]}" > "$diagnostics" || analyzer_status=$?
            if [[ $analyzer_status -gt 1 ]]; then
              jq . "$diagnostics"
              echo "::error::Configured zsh-lint for $repository failed with status $analyzer_status."
              exit "$analyzer_status"
            fi
            diagnostic_files+=("$diagnostics")
          done

          jq -s '{
            version: 1,
            summary: {
              files: ([.[].summary.files] | add),
              diagnostics: ([.[].summary.diagnostics] | add),
              errors: ([.[].summary.errors] | add),
              warnings: ([.[].summary.warnings] | add),
              infos: ([.[].summary.infos] | add),
              hints: ([.[].summary.hints] | add)
            },
            diagnostics: ([.[].diagnostics[]] | sort_by(.file, (.range.start.line // 0), (.range.start.column // 0), .rule))
          }' "${diagnostic_files[@]}" > "$RUNNER_TEMP/configured-corpus.json"
          jq . "$RUNNER_TEMP/configured-corpus.json"

          if ! jq -e '.summary.errors == 0' "$RUNNER_TEMP/configured-corpus.json" >/dev/null; then
            echo "::error::The configured corpus contains error-level diagnostics."
            exit 1
          fi

          expected=../zsh-lint/docs/project/configured-corpus-expected.json
          if ! jq -e 'all(.[]; (.classification | type == "string" and length > 0))' "$expected" >/dev/null; then
            echo "::error::Every configured corpus finding needs a non-empty classification."
            exit 1
          fi

          jq '[.[] | {repository, path, rule, severity, line}] | sort_by(.repository, .path, (.line // 0), .rule)' \
            "$expected" > "$RUNNER_TEMP/configured-expected-identities.json"
          jq '[.diagnostics[] |
            (.file | split("/")) as $parts |
            {
              repository: $parts[0],
              path: ($parts[1:] | join("/")),
              rule: .rule,
              severity: .severity,
              line: (.range.start.line // null)
            }
          ] | sort_by(.repository, .path, (.line // 0), .rule)' \
            "$RUNNER_TEMP/configured-corpus.json" > "$RUNNER_TEMP/configured-actual-identities.json"

          if ! diff -u "$RUNNER_TEMP/configured-expected-identities.json" "$RUNNER_TEMP/configured-actual-identities.json"; then
            echo "::error::Configured corpus diagnostics changed; review and classify every difference."
            exit 1
          fi

  regression-corpus:
    # Sources with open parser gaps cannot join the strict corpus, but a
    # change must still not break the files in them that parse today (#470).
    # This job compares the pull request's verdicts with its base, judged by
    # zsh -f -n, and fails only on a REGRESSED or FALSE-ACCEPT file.
    name: Regression corpus
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out zsh-lint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zsh-lint
          persist-credentials: false

      - name: Check out the pull request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: zsh-lint-base
          persist-credentials: false

      - name: Resolve pinned regression corpus revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          while read -r path _ revision _; do
            [[ -n $path ]] || continue
            if [[ ! $revision =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::regression-corpus.txt: $path is not pinned to a full commit SHA: $revision"
              exit 1
            fi
            echo "$path=$revision" >> "$GITHUB_OUTPUT"
          done < zsh-lint/docs/project/regression-corpus.txt
          for path in F-Sy-H zsh; do
            grep -q "^$path=" "$GITHUB_OUTPUT" || {
              echo "::error::regression-corpus.txt has no revision for $path"
              exit 1
            }
          done

      - name: Check out F-Sy-H
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: z-shell/F-Sy-H
          ref: ${{ steps.revisions.outputs.F-Sy-H }}
          path: corpus/F-Sy-H
          persist-credentials: false

      - name: Check out the Zsh Completion tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zsh-users/zsh
          ref: ${{ steps.revisions.outputs.zsh }}
          path: corpus/zsh
          sparse-checkout: Completion
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: zsh-lint/go.sum

      - name: Set up Zsh
        uses: z-shell/.github/actions/setup-zsh@4403e5a200c63596f641966dfb64e08a7a655ffa # main

      - name: Build survey binaries
        run: |
          (cd zsh-lint && go build -o "$RUNNER_TEMP/survey-head" ./cmd/zsh-lint-survey)
          (cd zsh-lint-base && go build -o "$RUNNER_TEMP/survey-base" ./cmd/zsh-lint-survey)

      - name: Compare regression corpus verdicts
        run: bash zsh-lint/.github/scripts/regression-corpus.sh
