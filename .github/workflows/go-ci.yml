---
name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - .golangci.yml
      - .github/workflows/go-ci.yml
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ⎔ Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Verify module files are tidy
        run: go mod tidy -diff
      - name: 🎨 Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: 🔎 Vet
        run: go vet ./...
      - name: 🏗 Build
        run: go build ./...
      # The native oracle test and the workflow behavior tests skip without
      # zsh; installing it makes them run here.
      - name: ⚡ Set up Zsh
        uses: z-shell/.github/actions/setup-zsh@4403e5a200c63596f641966dfb64e08a7a655ffa # main
      - name: 🧪 Test
        run: go test ./...
      # The parser fork keeps upstream's tests, which must keep passing
      # (ADR-0030, third_party/mvdan-sh/FORK.md).
      - name: 🧪 Test the parser fork
        working-directory: third_party/mvdan-sh
        run: go test ./syntax/ ./pattern/ ./expand/
      - name: 🔍 Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
