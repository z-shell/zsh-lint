---
name: Zsh Syntax Check
on:
  push:
    tags: ["v*.*.*"]
    branches:
      - main
    paths:
      - "**/*.zsh"
      - "legacy/functions/**"
      - ".github/workflows/zsh-n.yml"
  # Deliberately unfiltered. A path-filtered pull_request trigger never reports
  # on a pull request that touches no Zsh, and a required check that never
  # reports leaves such pull requests permanently pending. Keeping this
  # unfiltered is what makes the zsh-n-complete context safe to require.
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Set matrix output"
        id: set-matrix
        run: |
          MATRIX="$(find . -type d -name 'doc' -prune -o -type f \( -iname '*.zsh' -o -iname 'zsh-lint*' -o -iname '.zsh-lint*' -o -iname '@zsh-lint*' \) -print0 | jq -Rsc 'split("\u0000") | map(select(length > 0) | {"file": .}) | {"include": .}')"
          echo "MATRIX=${MATRIX}" >&2
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
  zsh-n:
    runs-on: ubuntu-latest
    needs: zsh-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.zsh-matrix.outputs.matrix) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "⚡ Install dependencies"
        run: sudo apt update && sudo apt-get install -y zsh && touch ~/.zshrc
      - name: "⚡ zsh -n: ${{ matrix.file }}"
        env:
          ZSH_FILE: ${{ matrix.file }}
        run: |
          zsh -n "${ZSH_FILE}"
      - name: "⚡ zcompile ${{ matrix.file }}"
        env:
          ZSH_FILE: ${{ matrix.file }}
        run: |
          zsh -fc 'zcompile -- "$1"' zsh "$ZSH_FILE"; rc=$?
          ls -al -- "${ZSH_FILE}.zwc"; exit "$rc"
  # The zsh-n job is a matrix over discovered files, so each leg reports as
  # "zsh-n (<path>)". Those context names change whenever a Zsh file is added,
  # renamed, or removed, which makes them unusable in a ruleset's
  # required_status_checks list. This job collapses the matrix into one stable
  # context name that a ruleset can require.
  zsh-n-complete:
    name: Zsh Syntax Check Complete
    runs-on: ubuntu-latest
    needs: [zsh-matrix, zsh-n]
    if: always()
    steps:
      - name: Verify every syntax check succeeded
        env:
          MATRIX_RESULT: ${{ needs.zsh-matrix.result }}
          SYNTAX_RESULT: ${{ needs.zsh-n.result }}
        run: |
          if [[ "${MATRIX_RESULT}" != "success" ]]; then
            echo "::error::Matrix construction did not succeed (${MATRIX_RESULT})."
            exit 1
          fi
          if [[ "${SYNTAX_RESULT}" != "success" ]]; then
            echo "::error::At least one zsh -n or zcompile leg did not succeed (${SYNTAX_RESULT})."
            exit 1
          fi
          echo "Every zsh -n and zcompile leg succeeded."
