version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - gofmt@1.24.11
    - golangci-lint2@2.12.2
    - prettier@3.9.6
    - gitleaks@8.30.1
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.49.1
runtimes:
  enabled:
    - go@1.24.11
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  disabled:
    - trunk-upgrade-available
    - trunk-single-player-auto-upgrade
    - trunk-single-player-auto-on-upgrade
